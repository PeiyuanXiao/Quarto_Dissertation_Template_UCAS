title: UCAS Thesis (中国科学院大学学位论文)
author: 基于 ucasthesis (Huangrui Mo) 的 Quarto 封装
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    pdf:
      # ---- 引擎与文档类 ----
      pdf-engine: xelatex
      documentclass: Style/ucasthesis
      template: template.tex
      papersize: a4
      classoption:
        - twoside
      # ---- 目录/编号交由模板手工控制 ----
      toc: false           # 目录在 before-body.tex 中手工 \tableofcontents
      number-sections: true
      number-depth: 3
      top-level-division: chapter
      indent: true
      # ---- 图表/链接 ----
      colorlinks: true
      link-citations: true
      # ---- 参考文献由 Style/artratex.sty 统一加载，正文使用 \citep{} 等命令 ----
      suppress-bibliography: true
      filters:
        - cite-to-latex.lua
      # ---- 注入前导/正文片段 ----
      include-in-header:
        - preamble.tex
        - frontinfo.tex          # 封面信息（用户编辑，位于 thesis/frontinfo.tex）
      template-partials:
        - partials/before-body.tex
        - partials/after-body.tex
      # ---- 避免 Quarto 重复加载已由类提供的功能 ----
      keep-tex: true
